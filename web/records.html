<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志记录 - QueQiao Router</title>
<link rel="icon" type="image/svg+xml" href="/dashboard/favicon.svg">
<link href="/dashboard/vendor/fonts/inter.css" rel="stylesheet">
<link href="/dashboard/assets/shell.css" rel="stylesheet">
<script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
        try {
            var mode = localStorage.getItem('queqiao_dashboard_theme') || 'system';
            var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', mode === 'system' ? (dark ? 'dark' : 'light') : mode);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>
<script src="/dashboard/assets/shell.js" defer></script>
<style>
    svg { display: block; }

    .card {
        background: var(--bg-secondary);
        margin: 12px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .mono {
        font-family: var(--font-mono);
        font-size: 12.5px;
    }

    .panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }

    .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 14px 22px;
    }
    .segmented {
        display: inline-flex;
        background: var(--bg-tertiary);
        border-radius: 9px;
        padding: 3px;
    }
    .segmented button {
        height: 28px;
        padding: 0 15px;
        font-size: 13px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
    }
    .segmented button.active {
        background: var(--bg-secondary);
        color: var(--brand-navy);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(16,24,40,.1);
    }
    .counter {
        position: absolute; right: 33px; font-size: 10.5px; color: var(--text-muted); pointer-events: none;
    }
    .field input.has-counter { padding-right: 66px; }
    /* 原生 datalist 下拉箭头占用输入框右缘，整体左移避免与清除按钮重叠 */
    .field.has-datalist .counter { right: 51px; }
    .field.has-datalist input.has-counter { padding-right: 84px; }
    .field.has-datalist .input-clear { right: 26px; }
    .range { display: inline-flex; align-items: center; gap: 8px; }
    .range .sep { color: var(--text-muted); font-size: 13px; }
    .range input[type="datetime-local"] { color: var(--text-secondary); }

    .range-preset { height: 34px; }
    .search-hint {
        font-size: 12px; color: var(--warning-text); background: var(--warning-bg);
        border: 1px solid var(--warning-bg); border-radius: 6px; padding: 4px 9px;
    }
    .search-hint[hidden] { display: none; }
    .advanced-filters {
        margin: 0 22px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: var(--bg-secondary);
    }
    .advanced-filters[hidden] { display: none; }
    .advanced-filters > summary {
        cursor: pointer; padding: 9px 14px; font-size: 13px; font-weight: 500;
        color: var(--text-secondary); list-style: none;
        display: flex; align-items: center; gap: 6px;
    }
    .advanced-filters > summary::-webkit-details-marker { display: none; }
    .advanced-filters > summary::after {
        content: ""; width: 7px; height: 7px; margin-left: 4px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg); transition: transform .15s ease;
    }
    .advanced-filters[open] > summary::after { transform: rotate(-135deg); }
    .advanced-filter-body { padding: 4px 14px 14px; }

    .table-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
    .table-wrap[hidden] { display: none; }
    .table-wrap::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 64px;
        pointer-events: none;
        opacity: 0;
        transition: opacity .15s ease;
        background: linear-gradient(to left, var(--bg-secondary) 0%, var(--bg-secondary) 10%, transparent 100%);
        box-shadow: -14px 0 18px -14px rgba(15, 23, 42, .5);
    }
    .table-wrap.is-scrollable:not(.at-end)::after { opacity: 1; }
    .table-scroll { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 0 22px; }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
    thead th {
        position: sticky; top: 0; z-index: 2;
        background: var(--bg-tertiary);
        color: var(--text-muted);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: .02em;
        text-align: left;
        padding: 11px 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid var(--border-light);
    }
    tbody td {
        padding: 11px 10px;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border-light);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
    }
    .col-time { width: 178px; }
    .col-model { width: 215px; }
    .col-status { width: 70px; }
    .col-client { width: 112px; }
    .col-session { width: 112px; }
    .col-usage { width: 140px; }
    .col-latency { width: 160px; }
    .col-preview { width: auto; }
    .col-actions { width: 78px; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: var(--bg-tertiary); }
    .time { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    td.col-usage, td.col-latency { white-space: normal; }
    .col-usage .metric, .col-latency .metric { vertical-align: middle; }
    .cell-main {
        display: block; font-weight: 500;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cell-sub {
        display: block; margin-top: 2px; font-size: 11.5px; color: var(--text-muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .model-cell { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .model-name {
        min-width: 0; font-weight: 600; color: var(--text-primary);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .model-cell .pill { margin-left: 0; flex: 0 0 auto; }
    .pill {
        display: inline-flex; align-items: center;
        margin-left: 7px; padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px; font-weight: 500;
        background: var(--bg-tertiary); color: var(--text-secondary);
        vertical-align: middle;
    }
    .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .status-2xx { color: var(--success); }
    .status-2xx .dot { background: var(--success); }
    .status-3xx, .status-4xx { color: var(--warning); }
    .status-3xx .dot, .status-4xx .dot { background: var(--warning); }
    .status-5xx { color: var(--danger); }
    .status-5xx .dot { background: var(--danger); }

    .metrics { display: inline-flex; flex-direction: column; gap: 2px; max-width: 100%; }
    .metric-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .metric { display: inline-flex; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .metric svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .metric.rounds svg { color: var(--primary); }
    .metric.tokens svg { color: var(--accent-violet); }
    .metric.tools svg { color: var(--warning); }
    .metric.latency svg { color: var(--success); }
    .metric.ttft svg { color: var(--danger); }
    /* 深色模式：提亮分段控件文字、加强横向滚动提示的阴影对比 */
    [data-theme="dark"] .segmented button.active { color: var(--text-primary); }
    [data-theme="dark"] .table-wrap::after { box-shadow: -14px 0 18px -14px rgba(0, 0, 0, .7); }

    td.preview { white-space: normal; overflow: hidden; vertical-align: top; }
    .empty-cell { color: var(--text-muted); }
    .preview-text {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--text-secondary);
    }
    .link, .expand-link {
        background: none; border: 0; padding: 0; font: inherit;
        color: var(--primary-strong); cursor: pointer; text-align: left;
    }
    .link { font-weight: 500; }
    .link:hover, .expand-link:hover { text-decoration: underline; }
    .expand-link { display: inline-block; margin-top: 3px; font-size: 11.5px; }
    .link:focus-visible, .expand-link:focus-visible, .banner-retry:focus-visible {
        outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 3px;
    }
    .state-row td { text-align: center; color: var(--text-muted); padding: 54px 8px; }
    .no-match { display: inline-block; margin-right: 10px; }
    .state-row .btn-ghost { height: 28px; padding: 0 12px; font-size: 12.5px; }

    .skel {
        display: block; height: 12px; width: 100%; border-radius: 4px;
        background: var(--bg-tertiary);
        background-image: linear-gradient(90deg, transparent, rgba(148, 163, 184, .25), transparent);
        background-size: 200% 100%;
        animation: skel-shimmer 1.2s ease-in-out infinite;
    }
    .skel-row td { padding: 13px 10px; }
    .skel-entry { display: flex; flex-direction: column; gap: 8px; }
    .skel-entry .skel.short { width: 55%; }
    @keyframes skel-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    .banner.show { display: flex; align-items: center; gap: 12px; }
    .banner-retry {
        margin-left: auto; flex: 0 0 auto;
        height: 26px; padding: 0 12px;
        border: 1px solid var(--danger-border); border-radius: 6px;
        background: var(--bg-secondary); color: var(--danger-text);
        font: inherit; font-size: 12.5px; cursor: pointer;
    }
    .banner-retry:hover { border-color: var(--danger-text); }

    .pager {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        padding: 13px 22px 15px;
        color: var(--text-secondary);
        font-size: 12.5px;
        flex-wrap: wrap;
        border-top: 1px solid var(--border-light);
    }
    .pager .btn-ghost {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--border-color);
        border-radius: 7px;
        background: var(--bg-secondary);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 12.5px;
        font-family: inherit;
        transition: all .15s;
    }
    .pager .btn-ghost:hover:not(:disabled) { border-color: var(--primary-strong); color: var(--primary-strong); }
    .pager .btn-ghost:disabled { color: var(--text-muted); cursor: default; background: var(--bg-tertiary); }
    .pager select { height: 28px; border-radius: 7px; color: var(--text-secondary); }
    .pager .page-info { color: var(--text-muted); }

    .log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 22px; gap: 8px; }
    .log-meta { font-size: 12px; color: var(--text-muted); }
    .log-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
    .log-entry {
        border: 1px solid var(--border-color); border-radius: 9px; background: var(--bg-secondary);
        padding: 10px 12px; font-size: 12.5px;
    }
    .log-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .log-time {
        color: var(--text-muted); font-variant-numeric: tabular-nums;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .log-path { color: var(--text-primary); font-weight: 500; word-break: break-all; }
    .log-err {
        margin-top: 6px; color: var(--danger-text); background: var(--danger-bg); border: 1px solid var(--danger-border);
        border-radius: 7px; padding: 7px 9px; word-break: break-word;
    }
    .log-meta-line { margin-top: 6px; color: var(--text-muted); word-break: break-all; }
    .log-kind { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; }
    .log-kind.stream { background: var(--warning-bg); color: var(--warning-text); }
    .log-kind.other { background: var(--bg-tertiary); color: var(--text-secondary); }
    .log-raw {
        margin: 0; white-space: pre-wrap; word-break: break-all; color: var(--text-secondary);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    }
    .log-detail { margin-top: 8px; }
    .log-detail summary { cursor: pointer; color: var(--primary-strong); font-size: 12px; }
    .log-detail pre {
        margin: 6px 0 0; padding: 9px 11px; background: var(--bg-tertiary); border: 1px solid var(--border-color);
        border-radius: 7px; white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px;
    }
    .filters.file-mode > .field,
    .filters.file-mode > #scopeSelect,
    .filters.file-mode > .range-preset,
    .filters.file-mode > .search-hint { display: none; }
    .filters.file-mode ~ .advanced-filters { display: none; }
    .log-wrap[hidden], .table-scroll[hidden] { display: none; }

    .drawer-backdrop {
        position: fixed; inset: 0; background: rgba(16,24,40,.42);
        opacity: 0; visibility: hidden; transition: opacity .2s; z-index: 40;
        backdrop-filter: blur(1px);
    }
    .drawer-backdrop.open { opacity: 1; visibility: visible; }
    .drawer {
        position: fixed; top: 0; right: 0; height: 100%; width: 680px; max-width: 100%;
        background: var(--bg-secondary); box-shadow: -8px 0 28px rgba(16,24,40,.16);
        transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1); z-index: 41;
        display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border-light);
    }
    .drawer-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .drawer-title svg { width: 17px; height: 17px; color: var(--brand-navy); }
    .drawer-close {
        width: 28px; height: 28px; border: none; border-radius: 7px; background: var(--bg-tertiary);
        color: var(--text-secondary); font-size: 17px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .drawer-close:hover { background: var(--border-color); }
    .drawer-body { padding: 20px 22px 48px; overflow: auto; }
    .group { margin-bottom: 18px; }
    .group-title {
        display: flex; align-items: center; gap: 6px;
        font-size: 12px; font-weight: 600; color: var(--text-muted);
        letter-spacing: .04em; margin-bottom: 10px;
    }
    .group-title svg { width: 14px; height: 14px; }
    .meta-grid { display: grid; grid-template-columns: 112px 1fr; gap: 8px 14px; font-size: 13px; }
    .meta-grid dt { color: var(--text-muted); }
    .meta-grid dd { margin: 0; color: var(--text-primary); word-break: break-all; }
    .section { margin-top: 14px; border: 1px solid var(--border-color); border-radius: 9px; overflow: hidden; }
    .section summary {
        cursor: pointer; padding: 11px 15px; font-size: 13px; font-weight: 600;
        color: var(--text-primary); background: var(--bg-tertiary); list-style: none;
        display: flex; align-items: center; gap: 7px;
    }
    .section summary::-webkit-details-marker { display: none; }
    .section summary svg { width: 15px; height: 15px; color: var(--text-muted); }
    .section pre {
        margin: 0; padding: 15px; max-height: 340px; overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
        color: var(--text-secondary); background: var(--bg-secondary);
    }
    .drawer-btn {
        margin-top: 14px; height: 34px; padding: 0 16px; border: 1px solid var(--brand-navy);
        border-radius: 8px; background: var(--bg-secondary); color: var(--brand-navy); font-size: 13px;
        font-weight: 500; cursor: pointer; font-family: inherit;
        display: inline-flex; align-items: center; gap: 7px;
        transition: all .15s;
    }
    .drawer-btn:hover:not(:disabled) { background: var(--bg-tertiary); }
    .drawer-btn:disabled { opacity: .6; cursor: default; }
    .drawer-btn svg { width: 15px; height: 15px; }
    .hint { color: var(--text-muted); font-size: 12.5px; margin-top: 14px; }

    .drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 18px; }
    .drawer-actions .drawer-btn { margin-top: 0; }
    .timeline-summary {
        display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
        margin-bottom: 16px;
    }
    .timeline-summary-item {
        min-width: 0; padding: 10px; border: 1px solid var(--border-color);
        border-radius: var(--radius-sm); background: var(--bg-tertiary);
    }
    .timeline-summary-label {
        display: block; color: var(--text-muted); font-size: 11px; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
    }
    .timeline-summary-value {
        display: block; margin-top: 5px; color: var(--text-primary); font-size: 13px;
        font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
    }
    .timeline-list { display: flex; flex-direction: column; gap: 8px; }
    .timeline-item {
        position: relative; display: grid; grid-template-columns: 154px minmax(0, 1fr) auto;
        gap: 10px; align-items: center; width: 100%; padding: 10px 11px;
        border: 1px solid var(--border-color); border-radius: var(--radius-sm);
        background: var(--bg-secondary); color: var(--text-primary); text-align: left;
        font: inherit; cursor: pointer; transition: background .15s, border-color .15s, transform .15s;
    }
    .timeline-item:hover { background: var(--bg-tertiary); border-color: var(--primary); }
    .timeline-item:active { transform: scale(.99); }
    .timeline-time { color: var(--text-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .timeline-main { min-width: 0; }
    .timeline-model { display: block; overflow: hidden; color: var(--text-primary); font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .timeline-meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 4px; color: var(--text-muted); font-size: 11.5px; }
    .timeline-request { max-width: 142px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); }
    .timeline-status { justify-self: end; }
    .timeline-status .status { font-size: 12px; }
    .tree-loading { margin: 0; color: var(--text-muted); font-size: 12.5px; }
    .tree-notice { margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--warning-bg); border-radius: var(--radius-sm); background: var(--warning-bg); color: var(--warning-text); font-size: 12px; }
    .call-tree { min-width: 0; }
    .call-tree-node { min-width: 0; }
    .call-tree-node + .call-tree-node { margin-top: 7px; }
    .call-tree-node details { min-width: 0; }
    .call-tree-summary {
        display: flex; align-items: flex-start; gap: 8px; min-width: 0; padding: 9px 10px;
        border: 1px solid var(--border-color); border-radius: var(--radius-sm);
        background: var(--bg-secondary); cursor: pointer; list-style: none;
    }
    .call-tree-summary::-webkit-details-marker { display: none; }
    .call-tree-summary::before {
        content: ""; flex: 0 0 auto; width: 7px; height: 7px; margin-top: 4px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        color: var(--text-muted); transform: rotate(-45deg); transition: transform .15s;
    }
    .call-tree-node details:not([open]) > .call-tree-summary::before { transform: rotate(-45deg); }
    .call-tree-node details[open] > .call-tree-summary::before { transform: rotate(45deg); }
    .call-tree-summary:hover { background: var(--bg-tertiary); border-color: var(--primary); }
    .call-tree-summary:focus-visible, .timeline-item:focus-visible {
        outline: 2px solid var(--primary); outline-offset: 2px;
    }
    .call-tree-summary .status { flex: 0 0 auto; margin-top: 1px; }
    .call-tree-content { min-width: 0; flex: 1; }
    .call-tree-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .call-tree-model { min-width: 0; overflow: hidden; color: var(--text-primary); font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .call-tree-basis { flex: 0 0 auto; color: var(--text-muted); font-size: 11px; }
    .call-tree-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; color: var(--text-muted); font-size: 11.5px; }
    .call-tree-request { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); }
    .call-tree-children { margin: 7px 0 0 12px; padding-left: 14px; border-left: 1px solid var(--border-color); }

    .filters #searchInput { width: 246px; }
    .filters #refreshBtn { margin-left: auto; }

    @media (max-width: 960px) {
        .filters #refreshBtn { margin-left: 0; }
        .table-scroll { padding: 0 12px; }
        .drawer { width: 100%; }
        td.preview { max-width: 220px; }
        .timeline-summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 1279px) {
        .col-session { display: none; }
        .col-preview { width: 170px; }
    }

    @media (max-width: 900px) {
        .col-client, .col-usage { display: none; }
        .col-preview { width: 180px; }
    }

    /* Narrow screens: stack the time range and fields so nothing overflows the card. */
    @media (max-width: 640px) {
        .filters { padding: 12px 14px; gap: 8px; }
        .filters > .field,
        .filters > .range-preset,
        .filters > .search-hint,
        .filters #searchInput { width: 100%; }
        .range {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            gap: 6px;
        }
        .range .field { width: 100%; }
        .range input[type="datetime-local"] { width: 100%; }
        .range .sep { text-align: center; font-size: 12px; }
        .filters #refreshBtn { width: 100%; }
        .advanced-filters { margin: 0 14px 10px; }
        .table-scroll { padding: 0 12px; }
        .drawer { width: 100%; }
        .timeline-item { grid-template-columns: 1fr auto; }
        .timeline-time { grid-column: 1 / -1; }
        .timeline-status { grid-column: 2; grid-row: 2; }
        .timeline-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .timeline-request { max-width: 100%; }
    }
</style>
</head>
<body>
<header class="app-header">
  <a class="app-brand" href="/dashboard">
    <span class="app-brand-mark">Q</span>
    <span class="app-brand-text">
      <span class="app-brand-name">QueQiao Router</span>
      <span class="app-brand-sub">大模型路由网关</span>
    </span>
  </a>
  <nav class="app-nav" aria-label="主导航">
    <a href="/dashboard">实时监控</a>
    <a href="/dashboard/records">日志记录</a>
    <a href="/dashboard/analysis">日志分析</a>
  </nav>
  <div class="app-actions">
    <select id="themeSelect" class="theme-select" aria-label="主题">
      <option value="system">跟随系统</option>
      <option value="light">浅色模式</option>
      <option value="dark">深色模式</option>
    </select>
    <span class="app-status" id="appStatus" role="status" data-state="unknown">
      <span class="app-status-dot" aria-hidden="true"></span>
      <span id="appStatusText">检测中</span>
    </span>
    <time class="app-updated" id="appUpdated">最后更新 --:--:--</time>
  </div>
</header>
<main class="app-main">

<div class="card page-fill">
    <section class="panel active" id="panel-records">
        <div class="filters">
            <div class="segmented" id="modeToggle" role="group" aria-label="日志类型">
                <button data-errors="0" class="active">推理日志</button>
                <button data-errors="1">错误日志</button>
            </div>
            <select id="scopeSelect" aria-label="检索维度">
                <option value="q">按关键词</option>
                <option value="model">按模型名</option>
                <option value="ip">按请求IP</option>
                <option value="apikey">按API Key</option>
                <option value="client">按客户端</option>
                <option value="session_id">按会话ID</option>
                <option value="parent_session_id">按父会话ID</option>
                <option value="request_id">按请求ID</option>
            </select>
            <datalist id="modelOptions"></datalist>
            <datalist id="clientOptions"></datalist>
            <div class="field" id="searchField">
                <label class="sr-only" for="searchInput">检索内容</label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.2-3.2"></path></svg>
                <input type="text" id="searchInput" class="has-counter" placeholder="请输入关键词" maxlength="128">
                <button type="button" class="input-clear" id="searchClear" hidden aria-label="清空检索内容">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                </button>
                <span class="counter" id="searchCounter" aria-hidden="true">0/128</span>
            </div>
            <span class="search-hint" id="searchHint" hidden>关键词少于 3 个字符会触发全表扫描，可能较慢</span>
            <select id="rangePreset" class="range-preset" aria-label="快速时间范围">
                <option value="">不限时间</option>
                <option value="1h">最近 1 小时</option>
                <option value="24h">最近 24 小时</option>
                <option value="7d">最近 7 天</option>
                <option value="custom">自定义…</option>
            </select>
            <button class="btn btn-primary" id="refreshBtn" type="button">查询</button>
        </div>
        <details class="advanced-filters" id="advancedFilters">
            <summary>高级筛选</summary>
            <div class="advanced-filter-body">
                <div class="range">
                    <div class="field">
                        <label class="sr-only" for="fromInput">起始时间</label>
                        <input type="datetime-local" id="fromInput" step="1">
                    </div>
                    <span class="sep" aria-hidden="true">至</span>
                    <div class="field">
                        <label class="sr-only" for="toInput">结束时间</label>
                        <input type="datetime-local" id="toInput" step="1">
                    </div>
                </div>
            </div>
        </details>
        <div class="banner banner-error" id="errorBanner" role="alert"></div>
        <div class="table-wrap" id="tableWrap">
            <div class="table-scroll" id="tableScroll">
                <table>
                    <caption class="sr-only">请求审计记录列表：时间、模型、状态、客户端、会话、用量、时延与提问预览</caption>
                    <thead>
                        <tr>
                            <th scope="col" class="col-time">请求时间</th>
                            <th scope="col" class="col-model">模型</th>
                            <th scope="col" class="col-status">状态</th>
                            <th scope="col" class="col-client">客户端</th>
                            <th scope="col" class="col-session">会话 / 请求</th>
                            <th scope="col" class="col-usage">用量</th>
                            <th scope="col" class="col-latency">时延</th>
                            <th scope="col" class="col-preview">提问预览</th>
                            <th scope="col" class="col-actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="log-wrap" id="logWrap" hidden>
            <div class="log-meta" id="logMeta"></div>
            <div class="log-list" id="logList"></div>
        </div>
        <div class="pager">
            <span id="totalText">共 0 条</span>
            <button class="btn-ghost" id="prevBtn" disabled>上一页</button>
            <span class="page-info" id="pageText">第 1 页</span>
            <button class="btn-ghost" id="nextBtn" disabled>下一页</button>
            <select id="sizeSelect">
                <option value="20" selected>20 条/页</option>
                <option value="50">50 条/页</option>
                <option value="100">100 条/页</option>
                <option value="200">200 条/页</option>
            </select>
        </div>
    </section>
</div>
</main>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-head">
        <div class="drawer-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h8M8 17h5"></path></svg>
            <span id="drawerTitle">请求详情</span>
        </div>
        <button type="button" class="drawer-close" id="drawerClose" aria-label="关闭">&times;</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="/dashboard/assets/records.js" defer></script>
</body>
</html>
