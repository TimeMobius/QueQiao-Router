<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志记录 - QueQiao Router</title>
<style>
    :root {
        --navy: #1F3A6D;
        --navy-deep: #16224A;
        --accent: #3B6FD4;
        --bg: #F2F4F7;
        --card: #ffffff;
        --border: #E4E7ED;
        --border-light: #F2F4F7;
        --text: #1D2939;
        --text-sub: #475467;
        --text-muted: #98A2B3;
        --placeholder: #B9C0CC;
        --head-bg: #FAFBFC;
        --link: #2B6CB0;
        --green: #12A05C;
        --orange: #D98219;
        --red: #E5484D;
        --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                     "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
    }
    svg { display: block; }

    .topbar {
        height: 54px;
        display: flex;
        align-items: center;
        padding: 0 22px;
        color: #fff;
        background: linear-gradient(120deg, var(--navy-deep) 0%, var(--navy) 62%, #24467F 100%);
        position: relative;
        overflow: hidden;
    }
    .topbar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(115deg, rgba(255,255,255,0.055) 0 34px, rgba(255,255,255,0) 34px 96px);
        pointer-events: none;
    }
    .topbar-left { display: flex; align-items: center; gap: 28px; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: .3px; }
    .brand-mark {
        width: 24px; height: 24px; border-radius: 7px;
        background: rgba(255,255,255,.16);
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 800;
    }
    .topnav { display: flex; gap: 24px; }
    .topnav a {
        color: rgba(255,255,255,.7);
        text-decoration: none;
        font-size: 14px;
        padding: 5px 0;
        border-bottom: 2px solid transparent;
        transition: color .15s;
    }
    .topnav a:hover { color: #fff; }
    .topnav a.active { color: #fff; font-weight: 600; border-bottom-color: rgba(255,255,255,.9); }

    .card {
        background: var(--card);
        margin: 12px;
        border-radius: var(--radius);
        height: calc(100vh - 78px);
        box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .tabs { display: flex; gap: 30px; padding: 0 22px; border-bottom: 1px solid var(--border-light); }
    .tab {
        padding: 15px 2px 13px;
        font-size: 14px;
        color: var(--text-sub);
        cursor: default;
        border-bottom: 2px solid transparent;
        user-select: none;
    }
    .tab.active { color: var(--navy); font-weight: 600; border-bottom-color: var(--navy); }
    .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
    }

    .panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }

    .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 14px 22px;
    }
    .segmented {
        display: inline-flex;
        background: #F2F4F7;
        border-radius: 9px;
        padding: 3px;
    }
    .segmented button {
        height: 28px;
        padding: 0 15px;
        font-size: 13px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--text-sub);
        cursor: pointer;
        font-family: inherit;
        transition: all .15s;
    }
    .segmented button.active {
        background: #fff;
        color: var(--navy);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(16,24,40,.1);
    }
    .field { position: relative; display: inline-flex; align-items: center; }
    .field > svg { position: absolute; left: 9px; width: 15px; height: 15px; color: var(--text-muted); pointer-events: none; }
    .field input { padding-left: 30px; }
    input[type="text"], input[type="datetime-local"], select {
        height: 34px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        color: var(--text);
        background: #fff;
        outline: none;
        font-family: inherit;
        transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--placeholder); }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,111,212,.13); }
    .counter {
        position: absolute; right: 9px; font-size: 10.5px; color: var(--placeholder); pointer-events: none;
    }
    .field input.has-counter { padding-right: 44px; }
    .range { display: inline-flex; align-items: center; gap: 8px; }
    .range .sep { color: var(--text-muted); font-size: 13px; }
    .range input[type="datetime-local"] { color: var(--text-sub); }
    .btn-primary {
        height: 34px;
        padding: 0 16px;
        border: none;
        border-radius: 8px;
        background: var(--navy);
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-left: auto;
        font-family: inherit;
        transition: background .15s, box-shadow .15s;
    }
    .btn-primary:hover { background: #24467F; box-shadow: 0 2px 6px rgba(31,58,109,.25); }
    .btn-primary svg { width: 15px; height: 15px; }

    .banner {
        display: none;
        margin: 0 22px 12px;
        padding: 10px 14px;
        border-radius: 8px;
        background: #FEF3F2;
        color: var(--red);
        border: 1px solid #FEE4E2;
        font-size: 13px;
    }
    .banner.show { display: block; }

    .table-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 22px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
        position: sticky; top: 0; z-index: 2;
        background: var(--head-bg);
        color: var(--text-muted);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: .02em;
        text-align: left;
        padding: 11px 10px;
        white-space: nowrap;
        border-bottom: 1px solid var(--border-light);
    }
    tbody td {
        padding: 11px 10px;
        color: var(--text);
        border-bottom: 1px solid var(--border-light);
        white-space: nowrap;
        vertical-align: middle;
    }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: #FAFBFC; }
    .num { width: 46px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .time { color: var(--text-sub); font-variant-numeric: tabular-nums; }
    .cell-main { display: block; font-weight: 500; }
    .cell-sub {
        display: block; margin-top: 2px; font-size: 11.5px; color: var(--text-muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .model-name { font-weight: 600; color: var(--text); }
    .pill {
        display: inline-flex; align-items: center;
        margin-left: 7px; padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px; font-weight: 500;
        background: #EEF2F6; color: #475467;
        vertical-align: middle;
    }
    .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .status-2xx { color: var(--green); }
    .status-2xx .dot { background: var(--green); }
    .status-3xx, .status-4xx { color: var(--orange); }
    .status-3xx .dot, .status-4xx .dot { background: var(--orange); }
    .status-5xx { color: var(--red); }
    .status-5xx .dot { background: var(--red); }

    .metrics { display: inline-flex; align-items: center; gap: 11px; }
    .metric { display: inline-flex; align-items: center; gap: 4px; color: var(--text-sub); font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .metric svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .metric.tokens svg { color: #7C5CD6; }
    .metric.rounds svg { color: #3B6FD4; }
    .metric.tools svg { color: #D98219; }
    .metric.latency svg { color: #12A05C; }
    .metric.ttft svg { color: #E5484D; }

    td.preview { white-space: normal; max-width: 360px; }
    .preview-text {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--text-sub);
    }
    .link { color: var(--link); cursor: pointer; font-weight: 500; }
    .link:hover { text-decoration: underline; }
    .expand-link { display: inline-block; margin-top: 3px; color: var(--accent); cursor: pointer; font-size: 11.5px; }
    .expand-link:hover { text-decoration: underline; }
    .state-row td { text-align: center; color: var(--text-muted); padding: 54px 8px; }

    .pager {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        padding: 13px 22px 15px;
        color: var(--text-sub);
        font-size: 12.5px;
        flex-wrap: wrap;
        border-top: 1px solid var(--border-light);
    }
    .pager .btn-ghost {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--text-sub);
        cursor: pointer;
        font-size: 12.5px;
        font-family: inherit;
        transition: all .15s;
    }
    .pager .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pager .btn-ghost:disabled { color: var(--placeholder); cursor: default; background: #FAFBFC; }
    .pager select { height: 28px; border-radius: 7px; color: var(--text-sub); }
    .pager .page-info { color: var(--text-muted); }

    .drawer-backdrop {
        position: fixed; inset: 0; background: rgba(16,24,40,.42);
        opacity: 0; visibility: hidden; transition: opacity .2s; z-index: 40;
        backdrop-filter: blur(1px);
    }
    .drawer-backdrop.open { opacity: 1; visibility: visible; }
    .drawer {
        position: fixed; top: 0; right: 0; height: 100%; width: 680px; max-width: 100%;
        background: #fff; box-shadow: -8px 0 28px rgba(16,24,40,.16);
        transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1); z-index: 41;
        display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border-light);
    }
    .drawer-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; color: var(--text); }
    .drawer-title svg { width: 17px; height: 17px; color: var(--navy); }
    .drawer-close {
        width: 28px; height: 28px; border: none; border-radius: 7px; background: #F2F4F7;
        color: var(--text-sub); font-size: 17px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .drawer-close:hover { background: #E4E7ED; }
    .drawer-body { padding: 20px 22px 48px; overflow: auto; }
    .group { margin-bottom: 18px; }
    .group-title {
        display: flex; align-items: center; gap: 6px;
        font-size: 12px; font-weight: 600; color: var(--text-muted);
        letter-spacing: .04em; margin-bottom: 10px;
    }
    .group-title svg { width: 14px; height: 14px; }
    .meta-grid { display: grid; grid-template-columns: 112px 1fr; gap: 8px 14px; font-size: 13px; }
    .meta-grid dt { color: var(--text-muted); }
    .meta-grid dd { margin: 0; color: var(--text); word-break: break-all; }
    .section { margin-top: 14px; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .section summary {
        cursor: pointer; padding: 11px 15px; font-size: 13px; font-weight: 600;
        color: var(--text); background: var(--head-bg); list-style: none;
        display: flex; align-items: center; gap: 7px;
    }
    .section summary::-webkit-details-marker { display: none; }
    .section summary svg { width: 15px; height: 15px; color: var(--text-muted); }
    .section pre {
        margin: 0; padding: 15px; max-height: 340px; overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
        color: var(--text-sub); background: #fff;
    }
    .drawer-btn {
        margin-top: 14px; height: 34px; padding: 0 16px; border: 1px solid var(--navy);
        border-radius: 8px; background: #fff; color: var(--navy); font-size: 13px;
        font-weight: 500; cursor: pointer; font-family: inherit;
        display: inline-flex; align-items: center; gap: 7px;
        transition: all .15s;
    }
    .drawer-btn:hover:not(:disabled) { background: #F5F8FF; }
    .drawer-btn:disabled { opacity: .6; cursor: default; }
    .drawer-btn svg { width: 15px; height: 15px; }
    .hint { color: var(--text-muted); font-size: 12.5px; margin-top: 14px; }

    @media (max-width: 960px) {
        .btn-primary { margin-left: 0; }
        .table-scroll { padding: 0 12px; }
        .drawer { width: 100%; }
        td.preview { max-width: 220px; }
    }
</style>
</head>
<body>
<header class="topbar">
    <div class="topbar-left">
        <div class="brand"><span class="brand-mark">Q</span>QueQiao Router</div>
        <nav class="topnav">
            <a href="/dashboard">监控总览</a>
            <a href="/dashboard/records" class="active">日志记录</a>
        </nav>
    </div>
</header>

<div class="card">
    <div class="tabs">
        <div class="tab active">日志记录</div>
    </div>

    <section class="panel active" id="panel-records">
        <div class="filters">
            <div class="segmented" id="modeToggle">
                <button data-errors="0" class="active">推理日志</button>
                <button data-errors="1">错误日志</button>
            </div>
            <div class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
                <input type="text" id="modelInput" class="has-counter" placeholder="请输入模型名称" maxlength="50" list="modelOptions" style="width:186px;">
                <span class="counter" id="modelCounter">0/50</span>
            </div>
            <datalist id="modelOptions"></datalist>
            <div class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.2-3.2"></path></svg>
                <input type="text" id="searchInput" class="has-counter" placeholder="请输入关键词" maxlength="50" style="width:200px;">
                <span class="counter" id="searchCounter">0/50</span>
            </div>
            <select id="scopeSelect">
                <option value="q">按关键词</option>
                <option value="ip">按请求IP</option>
                <option value="client">按客户端</option>
                <option value="session_id">按会话ID</option>
                <option value="parent_session_id">按父会话ID</option>
                <option value="request_id">按请求ID</option>
            </select>
            <div class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M10.9 12.1 20 3M17 6l2.5 2.5M14.5 8.5 17 11"></path></svg>
                <input type="text" id="apiKeyInput" placeholder="按 API Key 精确筛选" maxlength="128" style="width:206px;">
            </div>
            <div class="range">
                <div class="field"><input type="datetime-local" id="fromInput" step="1"></div>
                <span class="sep">至</span>
                <div class="field"><input type="datetime-local" id="toInput" step="1"></div>
            </div>
            <button class="btn-primary" id="refreshBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
                刷新
            </button>
        </div>
        <div class="banner" id="errorBanner"></div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th class="num">#</th>
                        <th>请求时间</th>
                        <th>模型</th>
                        <th>状态</th>
                        <th>客户端</th>
                        <th>会话 / 请求</th>
                        <th>用量</th>
                        <th>时延</th>
                        <th>提问预览</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="pager">
            <span id="totalText">共 0 条</span>
            <button class="btn-ghost" id="prevBtn" disabled>上一页</button>
            <span class="page-info" id="pageText">第 1 页</span>
            <button class="btn-ghost" id="nextBtn" disabled>下一页</button>
            <select id="sizeSelect">
                <option value="20" selected>20 条/页</option>
                <option value="50">50 条/页</option>
                <option value="100">100 条/页</option>
                <option value="200">200 条/页</option>
            </select>
        </div>
    </section>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
    <div class="drawer-head">
        <div class="drawer-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h8M8 17h5"></path></svg>
            <span id="drawerTitle">请求详情</span>
        </div>
        <button class="drawer-close" id="drawerClose">&times;</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
(function () {
    var API = "/dashboard/api/records";
    var state = { errors: false, cursor: null, stack: [], limit: 20, total: 0, nextCursor: null };

    var ICON = {
        tokens: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4 7l3-3 3 3M17 20V4M14 17l3 3 3-3"></path></svg>',
        rounds: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.9L3 21l1.9-5A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"></path></svg>',
        tools: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>',
        latency: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.2 1.9"></path></svg>',
        ttft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 9.5-11.5H13l1-8.5z"></path></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5M12 8h.01"></path></svg>',
        text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h16M4 16h9"></path></svg>',
        body: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg>'
    };

    var $ = function (id) { return document.getElementById(id); };
    var esc = function (v) {
        return String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    };
    var dash = function (v) { return (v === null || v === undefined || v === "") ? "-" : v; };
    var fmtMs = function (v) {
        if (v === null || v === undefined) return null;
        var n = Number(v);
        if (!isFinite(n)) return null;
        return n >= 1000 ? (n / 1000).toFixed(2) + "s" : Math.round(n) + "ms";
    };
    var fmtTokens = function (v) {
        if (v === null || v === undefined) return null;
        var n = Number(v);
        if (!isFinite(n)) return null;
        if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
        if (n >= 1000) return (n / 1000).toFixed(1) + "k";
        return String(n);
    };
    var clientText = function (it) {
        if (it.clientName) return it.clientName + (it.clientVersion ? " " + it.clientVersion : "");
        return it.userAgent || null;
    };
    var shortType = function (t) {
        if (!t) return null;
        if (t.indexOf("chat") === 0) return "chat";
        if (t.indexOf("completion") === 0) return "text";
        if (t.indexOf("embedding") === 0) return "embed";
        return t.split(".")[0];
    };
    var statusClass = function (s, err) {
        if (s === null || s === undefined) return err ? "status-5xx" : "";
        if (s >= 500) return "status-5xx";
        if (s >= 400) return "status-4xx";
        if (s >= 300) return "status-3xx";
        if (s >= 200) return "status-2xx";
        return "";
    };
    var localToMs = function (value) {
        if (!value) return null;
        var t = new Date(value).getTime();
        return isFinite(t) ? t : null;
    };
    function metric(cls, icon, value, title) {
        if (value === null || value === undefined) return "";
        return '<span class="metric ' + cls + '" title="' + esc(title) + '">' + icon + "<span>" + esc(value) + "</span></span>";
    }
    function sub(line) {
        return line ? '<span class="cell-sub">' + esc(line) + "</span>" : "";
    }

    function buildParams() {
        var p = new URLSearchParams();
        if (state.errors) p.set("errors", "1");
        var model = $("modelInput").value.trim();
        if (model) p.set("model", model);
        var search = $("searchInput").value.trim();
        if (search) p.set($("scopeSelect").value, search);
        var apiKey = $("apiKeyInput").value.trim();
        if (apiKey) p.set("apikey", apiKey);
        var from = localToMs($("fromInput").value);
        var to = localToMs($("toInput").value);
        if (from !== null) p.set("from", String(from));
        if (to !== null) p.set("to", String(to));
        p.set("limit", String(state.limit));
        if (state.cursor) p.set("cursor", state.cursor);
        return p;
    }

    function showError(msg) {
        var b = $("errorBanner");
        b.textContent = msg;
        b.classList.add("show");
    }
    function clearError() { $("errorBanner").classList.remove("show"); }
    function setRows(html) { $("tableBody").innerHTML = html; }

    function renderItems(items) {
        if (!items.length) {
            setRows('<tr class="state-row"><td colspan="10">暂无数据</td></tr>');
            return;
        }
        var html = items.map(function (it) {
            var type = shortType(it.type);
            var usage =
                metric("rounds", ICON.rounds, it.messageCount, "消息轮数") +
                metric("tools", ICON.tools, it.toolCount, "工具调用数") +
                metric("tokens", ICON.tokens, fmtTokens(it.totalTokens),
                    "总 Token（" + dash(it.promptTokens) + " 提问 / " + dash(it.completionTokens) + " 回复）");
            var timing =
                metric("latency", ICON.latency, fmtMs(it.latencyMs), "总时延") +
                metric("ttft", ICON.ttft, fmtMs(it.ttftMs), "首字时延 TTFT");
            var preview = it.promptPreview
                ? '<div class="preview-text">' + esc(it.promptPreview) + '</div><span class="expand-link" data-open="' + esc(it.id) + '">展开全部</span>'
                : '<span style="color:var(--text-muted)">-</span>';
            return "<tr>" +
                '<td class="num">' + esc(it.id) + "</td>" +
                '<td class="time">' + esc(dash(it.time)) + "</td>" +
                '<td><span class="model-name" title="' + esc(it.model) + '">' + esc(dash(it.model)) + "</span>" +
                    (type ? '<span class="pill">' + esc(type) + "</span>" : "") + "</td>" +
                '<td><span class="status ' + statusClass(it.status, it.error) + '"><span class="dot"></span>' + esc(dash(it.status)) + "</span></td>" +
                '<td><span class="cell-main">' + esc(dash(clientText(it))) + "</span>" + sub(it.ip) + "</td>" +
                '<td><span class="cell-main">' + esc(dash(it.sessionId)) + "</span>" + sub(it.requestId) + "</td>" +
                "<td>" + (usage || '<span style="color:var(--text-muted)">-</span>') + "</td>" +
                "<td>" + (timing || '<span style="color:var(--text-muted)">-</span>') + "</td>" +
                '<td class="preview">' + preview + "</td>" +
                '<td><span class="link" data-open="' + esc(it.id) + '">查看详情</span></td>' +
                "</tr>";
        }).join("");
        setRows(html);
    }

    function renderPager() {
        $("totalText").textContent = "共 " + state.total + " 条";
        $("pageText").textContent = "第 " + (state.stack.length + 1) + " 页";
        $("prevBtn").disabled = state.stack.length === 0;
        $("nextBtn").disabled = !state.nextCursor;
    }

    function load(reset) {
        if (reset) { state.cursor = null; state.stack = []; }
        clearError();
        setRows('<tr class="state-row"><td colspan="10">加载中…</td></tr>');
        fetch(API + "?" + buildParams().toString())
            .then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            })
            .then(function (data) {
                state.total = data.total || 0;
                state.nextCursor = data.nextCursor || null;
                renderItems(data.items || []);
                renderPager();
            })
            .catch(function (e) {
                setRows('<tr class="state-row"><td colspan="10">加载失败</td></tr>');
                showError("加载记录失败：" + e.message);
                renderPager();
            });
    }

    function loadFacets() {
        fetch(API + "/facets").then(function (r) { return r.json(); }).then(function (d) {
            $("modelOptions").innerHTML = (d.models || []).map(function (m) {
                return '<option value="' + esc(m) + '"></option>';
            }).join("");
        }).catch(function () {});
    }

    function openDrawer() {
        $("drawer").classList.add("open");
        $("backdrop").classList.add("open");
    }
    function closeDrawer() {
        $("drawer").classList.remove("open");
        $("backdrop").classList.remove("open");
    }

    function group(title, icon, grid) {
        return '<div class="group"><div class="group-title">' + icon + esc(title) + "</div>" + grid + "</div>";
    }
    function metaRow(label, value) {
        return "<dt>" + esc(label) + "</dt><dd>" + esc(dash(value)) + "</dd>";
    }
    function maskKey(v) {
        if (!v) return "";
        var s = String(v);
        if (s.length <= 8) return s.charAt(0) + "••••";
        return s.slice(0, 8) + "••••" + s.slice(-4);
    }
    function apiKeyRow(v) {
        if (!v) return metaRow("API Key", null);
        return '<dt>API Key</dt><dd><span class="mono" id="apiKeyVal" data-shown="0" data-full="' +
            esc(v) + '" data-masked="' + esc(maskKey(v)) + '">' + esc(maskKey(v)) +
            '</span> <span class="link" id="apiKeyToggle">显示</span></dd>';
    }
    function section(title, icon, text, open) {
        if (!text) return "";
        return '<details class="section"' + (open ? " open" : "") + "><summary>" + icon + esc(title) +
            "</summary><pre>" + esc(text) + "</pre></details>";
    }
    function pretty(raw) {
        if (!raw) return "";
        try { return JSON.stringify(JSON.parse(raw), null, 2); } catch (e) { return raw; }
    }

    function renderDetail(d) {
        var html =
            group("请求信息", ICON.info, '<dl class="meta-grid">' +
                metaRow("记录 ID", d.id) +
                metaRow("请求时间", d.time) +
                metaRow("类型", d.type) +
                metaRow("模型", d.model) +
                metaRow("状态", d.status) +
                metaRow("后端", d.backend) +
                metaRow("方法 / 端点", (d.method || "") + " " + (d.endpoint || "")) +
                metaRow("结束原因", d.finishReason) +
                metaRow("错误", d.error) +
                metaRow("重试次数", d.retryCount) +
            "</dl>") +
            group("客户端", ICON.text, '<dl class="meta-grid">' +
                metaRow("客户端", clientText(d)) +
                metaRow("User-Agent", d.userAgent) +
                metaRow("服务 IP", d.ip) +
                metaRow("会话 ID", d.sessionId) +
                metaRow("父会话 ID", d.parentSessionId) +
                metaRow("请求 ID", d.requestId) +
                apiKeyRow(d.apiKey) +
            "</dl>") +
            group("用量与耗时", ICON.tokens, '<dl class="meta-grid">' +
                metaRow("总 Token", d.totalTokens) +
                metaRow("提问 Token", d.promptTokens) +
                metaRow("回复 Token", d.completionTokens) +
                metaRow("消息轮数", d.messageCount) +
                metaRow("工具调用", d.toolCount) +
                metaRow("助手消息", d.assistantCount) +
                metaRow("工具结果", d.toolResultCount) +
                metaRow("图片数", d.imageCount) +
                metaRow("总时延", fmtMs(d.latencyMs)) +
                metaRow("TTFT", fmtMs(d.ttftMs)) +
                metaRow("上游耗时", fmtMs(d.upstreamMs)) +
                metaRow("流式耗时", fmtMs(d.streamMs)) +
                metaRow("请求体积", d.requestBytes) +
                metaRow("响应体积", d.responseBytes) +
            "</dl>");
        html += section("Prompt", ICON.text, d.prompt, true);
        html += section("RequestTail", ICON.body, d.requestTail);
        html += section("Answer", ICON.text, d.answer);
        html += section("ToolNames", ICON.tools, d.toolNames);
        html += '<div id="bodyArea"></div>';
        html += d.hasPayload
            ? '<button class="drawer-btn" id="loadBodyBtn">' + ICON.body + "加载完整正文</button>"
            : '<p class="hint">该记录无压缩正文（历史数据或正文为空）</p>';
        $("drawerBody").innerHTML = html;
        var btn = $("loadBodyBtn");
        if (btn) btn.addEventListener("click", function () { loadBody(d.id, btn); });
        var keyToggle = $("apiKeyToggle");
        if (keyToggle) keyToggle.addEventListener("click", function () {
            var el = $("apiKeyVal");
            var shown = el.getAttribute("data-shown") === "1";
            el.textContent = shown ? el.getAttribute("data-masked") : el.getAttribute("data-full");
            el.setAttribute("data-shown", shown ? "0" : "1");
            keyToggle.textContent = shown ? "显示" : "隐藏";
        });
    }

    function loadBody(id, btn) {
        btn.disabled = true;
        btn.textContent = "加载中…";
        fetch(API + "/" + id + "?include=body").then(function (r) { return r.json(); }).then(function (d) {
            $("bodyArea").innerHTML =
                section("完整请求体", ICON.body, pretty(d.request), true) +
                section("完整响应体", ICON.body, pretty(d.response)) +
                section("请求头", ICON.text, pretty(d.headers));
            btn.remove();
        }).catch(function (e) {
            btn.disabled = false;
            btn.innerHTML = ICON.body + "加载完整正文";
            showError("加载正文失败：" + e.message);
        });
    }

    function openDetail(id) {
        $("drawerTitle").textContent = "请求详情 #" + id;
        $("drawerBody").innerHTML = '<p class="hint">加载中…</p>';
        openDrawer();
        fetch(API + "/" + id).then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        }).then(renderDetail).catch(function (e) {
            $("drawerBody").innerHTML = '<p style="color:var(--red)">加载详情失败：' + esc(e.message) + "</p>";
        });
    }

    $("modeToggle").addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        this.querySelectorAll("button").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        state.errors = btn.getAttribute("data-errors") === "1";
        load(true);
    });

    $("tableBody").addEventListener("click", function (e) {
        var el = e.target.closest("[data-open]");
        if (el) openDetail(el.getAttribute("data-open"));
    });

    $("refreshBtn").addEventListener("click", function () { load(true); });
    $("prevBtn").addEventListener("click", function () {
        if (!state.stack.length) return;
        state.cursor = state.stack.pop();
        load(false);
    });
    $("nextBtn").addEventListener("click", function () {
        if (!state.nextCursor) return;
        state.stack.push(state.cursor);
        state.cursor = state.nextCursor;
        load(false);
    });
    $("sizeSelect").addEventListener("change", function () {
        state.limit = parseInt(this.value, 10) || 20;
        load(true);
    });
    $("modelInput").addEventListener("input", function () { $("modelCounter").textContent = this.value.length + "/50"; });
    $("modelInput").addEventListener("keydown", function (e) { if (e.key === "Enter") load(true); });
    $("searchInput").addEventListener("input", function () { $("searchCounter").textContent = this.value.length + "/50"; });
    $("searchInput").addEventListener("keydown", function (e) { if (e.key === "Enter") load(true); });
    $("apiKeyInput").addEventListener("keydown", function (e) { if (e.key === "Enter") load(true); });
    $("scopeSelect").addEventListener("change", function () {
        var labels = {
            q: "请输入关键词", ip: "请输入请求IP", client: "请输入客户端",
            session_id: "请输入会话ID", parent_session_id: "请输入父会话ID", request_id: "请输入请求ID"
        };
        $("searchInput").placeholder = labels[this.value] || "请输入关键词";
    });
    $("drawerClose").addEventListener("click", closeDrawer);
    $("backdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

    loadFacets();
    load(true);
})();
</script>
</body>
</html>
