[package]
name = "queqiao-router"
version = "0.2.586"
edition = "2021"
license = "Apache-2.0"
description = "QueQiao-Router: 高性能大模型智能路由网关 | A high-performance LLM smart routing gateway"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6.1"
validator = { version = "0.16", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
tokio-stream = "0.1.17"
futures = "0.3.31"
rand = { version = "0.8.5", features = ["std_rng"] }
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.5"
tracing-appender = "0.2.3"
tower-http = { version = "0.5", features = ["cors"] }
eventsource-stream = "0.2.3"
mime = "0.3.17"
rust-embed = "8"
once_cell = "1.21.3"
mimalloc = "0.1.48"
simd-json = "0.17.0"
prometheus = "0.13"
dashmap = "5.5"
sha2 = "0.10"
zstd = "0.13"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"

[features]
default = []
check-api-auth = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
